services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms_registry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms_registry_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
volumes:
  postgres_data:
